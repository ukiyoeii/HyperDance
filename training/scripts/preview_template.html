<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>街舞骨架 · 数据检查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a101a;color:#ecf2fa;font:16px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1160px;margin:auto;padding:42px 28px}h1{font-size:32px;margin:8px 0}h2{font-size:22px;margin:0 0 6px}.eyebrow{color:#64dec6;letter-spacing:3px;font-size:12px}.muted{color:#a4b4c8}header{margin-bottom:26px}.stats{display:flex;gap:12px;margin:24px 0}.stat{flex:1;border:1px solid #293648;background:#121c2a;border-radius:14px;padding:14px 20px}.stat strong{display:block;font-size:26px}.layout{display:grid;grid-template-columns:280px 1fr;gap:22px}.sidebar,.viewer{border:1px solid #293648;background:#111a28;border-radius:18px;padding:20px}.sidebar{max-height:680px;overflow:auto}.group{font-size:12px;color:#a4b4c8;margin:18px 0 8px}.sample{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid transparent;background:transparent;color:#dce6f4;border-radius:8px;cursor:pointer;font:inherit}.sample:hover{background:#1d2d41}.sample.active{background:#183b3a;border-color:#3b9d8a;color:#81f0d6}.badge{font-size:12px;color:#82e5ce;background:#173c39;padding:3px 8px;border-radius:5px}canvas{width:100%;height:auto;display:block;background:#0c1320;border-radius:12px;margin:18px 0}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{border:1px solid #3b4b61;border-radius:7px;background:#203047;color:#fff;padding:8px 14px;cursor:pointer}input[type=range]{flex:1;min-width:100px;accent-color:#64dec6}.source{overflow-wrap:anywhere;font-size:12px;margin-top:14px}.notice{padding:14px 18px;background:#182538;border-radius:12px;margin:20px 0;font-size:14px}footer{font-size:13px;color:#95a8bf;margin-top:18px}@media(max-width:750px){.layout{grid-template-columns:1fr}.sidebar{max-height:230px}.stats{flex-wrap:wrap}.stat{min-width:130px}main{padding:24px 14px}}
</style>
<main>
<header><div class="eyebrow">DANCE RECOGNITION / STEP 01</div><h1>先认识数据里的舞者</h1><div class="muted">真实数据集骨架预览 · 10 个舞种 + 3 类 Breaking 动作</div></header>
<div class="stats"><div class="stat"><strong id="aistCount"></strong><span class="muted">AIST++ 官方名单内序列</span></div><div class="stat"><strong id="braceCount"></strong><span class="muted">BRACE 动作片段</span></div><div class="stat"><strong>17</strong><span class="muted">COCO 人体关节点</span></div></div>
<div class="layout"><aside class="sidebar" id="samples" aria-label="选择骨架样本"></aside><section class="viewer"><span class="badge">数据自带标签 · 非模型预测</span><h2 id="title"></h2><div id="meta" class="muted"></div><canvas id="canvas" width="720" height="500" aria-label="人体骨架动画"></canvas><div class="controls"><button id="play" type="button">暂停</button><input id="seek" aria-label="播放进度" type="range" min="0" max="1000" value="0"><span id="time"></span><select id="speed" aria-label="播放速度"><option value="0.5">0.5 倍速</option><option value="1" selected>1 倍速</option><option value="2">2 倍速</option></select></div><div class="source muted" id="source"></div></section></div>
<div class="notice">这不是识别网站成品。这里播放的是公开数据自带的人体关节点，标签来自数据集。每段最多预览约 6 秒；画面按整段骨架范围等比例缩放，隐藏无效或低置信度关节点。</div>
<footer>骨架预览不含原始视频、音乐或模型推理。AIST++ 选择一个有效点较多的机位；BRACE 的置信度字段是占位值，不代表真实检测可靠性。离线可用，不上传数据。</footer>
</main>
<script>
const DATA=__PREVIEW_DATA__;
const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d');
let selected=0, elapsed=0, playing=true, last=null;
$('aistCount').textContent=DATA.summary.aist.eligible_by_official_lists.toLocaleString();
$('braceCount').textContent=DATA.summary.brace.parsed.toLocaleString();
for(const group of ['AIST++','BRACE']){const label=document.createElement('div');label.className='group';label.textContent=group==='AIST++'?'AIST++ / 舞种':'BRACE / Breaking 动作';$('samples').append(label);DATA.clips.forEach((clip,i)=>{if(clip.source!==group)return;const button=document.createElement('button');button.className='sample';button.textContent=clip.title;button.dataset.index=i;button.onclick=()=>selectClip(i);$('samples').append(button);});}
function selectClip(i){selected=i;elapsed=0;last=null;const clip=DATA.clips[i];$('title').textContent=clip.title;$('meta').textContent=clip.source+' · '+clip.view+' · 原始 '+clip.fps+' fps';$('source').textContent='样本：'+clip.source_id;document.querySelectorAll('.sample').forEach(b=>b.classList.toggle('active',Number(b.dataset.index)===i));draw();}
function draw(){const clip=DATA.clips[selected];let idx=0;while(idx+1<clip.times.length&&clip.times[idx+1]<=elapsed)idx++;const points=clip.frames[idx],W=canvas.width,H=canvas.height,S=420,ox=(W-S)/2,oy=(H-S)/2;ctx.fillStyle='#0c1320';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#18283c';ctx.lineWidth=1;for(let i=0;i<=10;i++){const p=i*S/10;ctx.beginPath();ctx.moveTo(ox+p,oy);ctx.lineTo(ox+p,oy+S);ctx.moveTo(ox,oy+p);ctx.lineTo(ox+S,oy+p);ctx.stroke();}const good=p=>p[2]>=.2&&p.every(Number.isFinite);for(const [a,b] of DATA.edges){if(!good(points[a])||!good(points[b]))continue;ctx.strokeStyle=a>=11?'#a59cff':'#64dec6';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ox+points[a][0]*S,oy+points[a][1]*S);ctx.lineTo(ox+points[b][0]*S,oy+points[b][1]*S);ctx.stroke();}for(let j=0;j<points.length;j++){const p=points[j];if(!good(p))continue;ctx.fillStyle=j<5?'#ffc980':'#effffb';ctx.beginPath();ctx.arc(ox+p[0]*S,oy+p[1]*S,j<5?3:5,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#a4b4c8';ctx.font='13px Segoe UI';ctx.fillText('COCO-17 · ANNOTATED SKELETON',18,25);$('seek').value=Math.round(elapsed/clip.duration*1000);$('time').textContent=elapsed.toFixed(1)+' / '+clip.duration.toFixed(1)+'s';}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';last=null;};$('seek').oninput=()=>{elapsed=Number($('seek').value)/1000*DATA.clips[selected].duration;last=null;draw();};$('speed').onchange=()=>{last=null;};
function animate(now){if(last!==null&&playing)elapsed=(elapsed+Math.min((now-last)/1000,.2)*Number($('speed').value))%DATA.clips[selected].duration;last=now;draw();requestAnimationFrame(animate);}
selectClip(0);requestAnimationFrame(animate);
</script>
</html>
